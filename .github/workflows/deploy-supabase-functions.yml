name: Deploy Supabase Functions

on:
workflow_dispatch:
push:
branches:
- master
paths:
- “portal/supabase/functions/**”
- “.github/workflows/deploy-supabase-functions.yml”

jobs:
deploy:
runs-on: ubuntu-latest
env:
SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

steps:
- name: Checkout repository
uses: actions/checkout@v4

- name: Setup Node.js
uses: actions/setup-node@v4
with:
node-version: 20

- name: Deploy Pivot Edge Functions
working-directory: portal
run: |
if [ -z “$SUPABASE_ACCESS_TOKEN” ] || [ -z “$SUPABASE_PROJECT_ID” ]; then
echo “Missing SUPABASE_ACCESS_TOKEN or SUPABASE_PROJECT_ID repository secret”
exit 1
fi
npx supabase@3.2.0 init —force
npx supabase@3.2.0 functions deploy pivot-create —project-ref “$SUPABASE_PROJECT_ID” —use-api —yes
npx supabase@3.2.0 functions deploy pivot-status —project-ref “$SUPABASE_PROJECT_ID” —use-api —yes
npx supabase@3.2.0 functions deploy pivot-webhook —project-ref “$SUPABASE_PROJECT_ID” —use-api —no-verify-jwt —yes
npx supabase@3.2.0 functions deploy pivot-reconcile —project-ref “$SUPABASE_PROJECT_ID” —use-api —yes
npx supabase@3.2.0 functions deploy refine-final-review —project-ref “$SUPABASE_PROJECT_ID” —use-api —yes
npx supabase@3.2.0 functions deploy notify-papikostik-completed —project-ref “$SUPABASE_PROJECT_ID” —use-api —yes
